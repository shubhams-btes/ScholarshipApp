{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>{{ site_name }}</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" type="image/x-icon" href="{% static 'tests/images/favicon.png' %}" version="1.0" />
        <link href="{% static 'tests/css/custom.css' %}" rel="stylesheet" />
        <style>
.spinner {
    width: 48px;
    height: 48px;
    border: 5px solid #ddd;
    border-top-color: #f47c20;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
    </head>
    <body>
        <div class="exam-layout">
            <!-- LEFT PANEL -->
            <aside class="left-panel">
                <section class="sidebar-content">
                    <div class="logo">
                        <a href="#">
                            <img src="{% static 'tests/images/logo-white.png' %}" alt="BTES" />
                        </a>
                    </div>

                    <figure>
                        <img
                            src="{% static 'tests/images/successfully-submitted-the-quiz.png' %}"
                            alt=""
                        />
                    </figure>

                    <div class="copyright">Copyright © BTES. All rights reserved.</div>
                </section>
            </aside>

            <!-- RIGHT PANEL -->
            <main class="right-panel">
                <div class="content-area">
                    <div class="logo">
					<a href="#"><img src="{% static 'tests/images/logo1.png' %}" alt="BTES" /></a>
			        </div>
                    <section class="question-section">
                        
                        <form method="post">
                            {% csrf_token %}

                            <h2 class="section-title">Verify Email</h2>
                            {% if messages %} {% for message in messages %}
                            <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                            {% endfor %} {% endif %}

                            <div class="divider"></div>

                            <div
                                class="otp-timer"
                                id="otpTimer"
                                style="font-weight: 600; margin: 12px 0"
                            >
                                OTP expires in
                                <span id="otpCountdown">--:--</span>
                            </div>

                            <div class="form-group">
                                <label>Enter OTP Sent To Your Email</label>

                                <input
                                    type="text"
                                    name="otp"
                                    maxlength="6"
                                    required
                                    autocomplete="off"
                                    placeholder="Enter OTP"
                                />
                            </div>

                            <div class="divider"></div>

                            <div
                                class="actions"
                                style="display: flex; gap: 12px; align-items: center"
                            >
                                <button type="submit" class="btn next">Verify OTP</button>
                        </form>
                                <!-- Resend lives in its own form but sits inline via flex -->
                                <form
                                    method="post"
                                    action="{% url 'resend_otp' %}"
                                    style="margin: 0"
                                    id="resendForm"
                                >
                                    {% csrf_token %}
                                    <button
                                        type="submit"
                                        id="resendBtn"
                                        class="btn"
                                        style="display: none"
                                    >
                                        Resend OTP
                                    </button>
                                </form>

                                <span
                                    id="resendWait"
                                    class="text-muted"
                                    style="align-self: center"
                                ></span>
                            </div>
                        
                    </section>
                </div>
            </main>
            <div id="loadingOverlay" style="display:none; position:fixed; inset:0;
                background:rgba(255,255,255,0.8); z-index:9999;
                align-items:center; justify-content:center; flex-direction:column;">
                <div class="spinner"></div>
                <p style="margin-top:16px; font-weight:600; color:#333;">Sending OTP…</p>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

        <script>
            setTimeout(function () {
                document.querySelectorAll('.alert').forEach(function (alert) {
                    alert.style.transition = 'opacity 0.5s';
                    alert.style.opacity = '0';

                    setTimeout(function () {
                        alert.remove();
                    }, 500);
                });
            }, 5000);
        </script>

        <script>
            (function () {
                var expiryMs   = {{ otp_expiry|default:0 }} * 1000;   // OTP validity (10 min)
                var resendAtMs = {{ resend_at|default:0 }} * 1000;    // resend allowed from

                var countdownEl = document.getElementById("otpCountdown");
                var timerEl     = document.getElementById("otpTimer");
                var otpInput    = document.querySelector('input[name="otp"]');
                var resendBtn   = document.getElementById("resendBtn");
                var wait        = document.getElementById("resendWait");

                var expiryDone = false;
                var resendDone = false;

                function tick() {
                    var now = Date.now();

                    // --- OTP validity countdown ---
                    if (!expiryDone) {
                        var remaining = Math.floor((expiryMs - now) / 1000);
                        if (remaining <= 0) {
                            countdownEl.textContent = "00:00";
                            timerEl.innerHTML = "Your OTP has expired. Please resend or register again.";
                            if (otpInput) otpInput.disabled = true;
                            if (resendBtn) resendBtn.style.display = "inline-block";  // let them resend
                            expiryDone = true;
                        } else {
                            var m = Math.floor(remaining / 60);
                            var s = remaining % 60;
                            countdownEl.textContent =
                                String(m).padStart(2, "0") + ":" + String(s).padStart(2, "0");
                        }
                    }

                    // --- Resend cooldown countdown ---
                    if (!resendDone) {
                        var r = Math.ceil((resendAtMs - now) / 1000);
                        if (r <= 0) {
                            if (resendBtn) resendBtn.style.display = "inline-block";
                            if (wait) wait.textContent = "";
                            resendDone = true;
                        } else {
                            if (resendBtn) resendBtn.style.display = "none";
                            if (wait) wait.textContent = "Resend available in " + r + "s";
                        }
                    }

                    if (expiryDone && resendDone) clearInterval(interval);
                }

                tick();
                var interval = setInterval(tick, 1000);
            })();
        </script>
        <script>
            (function () {
                var resendForm = document.getElementById('resendForm');
                if (resendForm) {
                    resendForm.addEventListener('submit', function () {
                        var overlay = document.getElementById('loadingOverlay');
                        if (overlay) overlay.style.display = 'flex';

                        var btn = document.getElementById('resendBtn');
                        if (btn) btn.disabled = true;   // prevent double-submit during the send
                        // form submits normally; overlay + redirect handle the rest
                    });
                }
            })();
            </script>
    </body>
</html>
